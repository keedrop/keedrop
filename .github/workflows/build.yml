name: Build

env:
  KEEDROP_CONTACT_GPGKEY: "0xdeadbead"
  KEEDROP_CONTACT_EMAIL: thedude@dudism.church
  KEEDROP_CONTACT_ADDRESS: Hollywood
  KEEDROP_CONTACT_NAME: Jeffrey Lebowski

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  server:
    name: Server
    runs-on: ubuntu-latest

    env:
      GOFLAGS: "-mod=readonly"

    services:
      # Label used to access the service container
      redis:
        # Docker Hub image
        image: redis
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:

    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Go 1.x
      uses: actions/setup-go@v7
      with:
        go-version: ^1.22
      id: go

    - name: Set up Ruby 3.4
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: "3.4"
        bundler-cache: true

    # The server tests serve pages from _site, so build the site first
    - name: Build site
      run: bundle exec jekyll build

    - name: Get Go dependencies
      run: go mod download

    - name: Build server
      run: go build -v .

    - name: Test server
      run: go test -v .

  site:
    name: Site
    runs-on: ubuntu-latest

    steps:

    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Ruby 3.4
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: "3.4"
        bundler-cache: true
      id: ruby

    - name: Set up node
      uses: actions/setup-node@v7
      with:
        node-version: "25"

    - name: Install Ruby dependencies
      run: |
        sudo apt-get install libpq-dev
        bundle config path vendor/bundle
        bundle install --jobs 4 --retry 3

    - name: Run E2E tests
      uses: cypress-io/github-action@v7
      with:
        start: bundle exec rake serve

    - name: Upload Cypress screenshots
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: cypress-screenshots
        path: cypress/screenshots
        if-no-files-found: ignore
